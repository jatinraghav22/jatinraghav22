<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0A0A10" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.6" />
  <text x="50" y="66" font-family="'Space Grotesk', sans-serif" font-size="46" font-weight="800" fill="url(#grad)" text-anchor="middle" letter-spacing="-2" filter="url(#glow)">JR</text>
</svg>